name: Build All Platforms (Android + Windows + Linux + iOS)

on:
  workflow_dispatch:
    inputs:
      unityVersion:
        description: 'Unity version (override only if the GameCI editor image is missing)'
        required: false
        default: '6000.4.7f1'
      releaseTag:
        description: 'Release tag to publish artifacts to (default: latest)'
        required: false
        default: 'latest'
  push:
    branches: [ feat/offline-hangzhou ]
    paths:
      - 'open_mahjong_unity/**'
      - '.github/workflows/build-all.yml'

permissions:
  contents: write

jobs:
  # WebGL 访客客户端最先构建：产物注入其余四平台的 StreamingAssets/WebHost，
  # 由各平台内嵌 SoloPython 服务在局域网托管，浏览器玩家开 http://主机IP:18763/ 加入。
  build-webgl:
    name: Build WebGL (browser guest client)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space (Unity builds need room)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: open_mahjong_unity/Library
          key: Library-WebGL-${{ hashFiles('open_mahjong_unity/Packages/manifest.json') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: open_mahjong_unity
          unityVersion: ${{ github.event.inputs.unityVersion || '6000.4.7f1' }}
          targetPlatform: WebGL
          allowDirtyBuild: true
          buildName: WebGL
          versioning: None
          buildsPath: build

      - name: Package WebGL guest build
        run: |
          find build -maxdepth 4 | head -n 40
          INDEX="$(find build -maxdepth 4 -name 'index.html' | sort | head -n 1)"
          if [ -z "$INDEX" ]; then
            echo "::error::WebGL index.html not found under build/"
            exit 1
          fi
          ROOT="$(dirname "$INDEX")"
          echo "WebGL root: $ROOT"
          # 剔除符号表，减小注入各平台的体积
          rm -f "$ROOT"/Build/*.symbols.json "$ROOT"/Build/*.symbolmap "$ROOT"/*.symbols.json "$ROOT"/*.symbolmap
          # 版本标记：宿主端（Android 解压缓存等）据此判断 WebHost 是否需要重新注入
          printf 'built %s %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "${GITHUB_SHA:0:8}" > "$ROOT/.version"
          mkdir -p "$GITHUB_WORKSPACE/webgl-dist"
          cp -r "$ROOT"/. "$GITHUB_WORKSPACE/webgl-dist/"
          du -sh "$GITHUB_WORKSPACE/webgl-dist"

      - name: Upload WebGL guest build
        uses: actions/upload-artifact@v4
        with:
          name: webgl-dist
          path: ${{ github.workspace }}/webgl-dist
          retention-days: 7

  build-android:
    name: Build Android APK
    needs: build-webgl
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download WebGL guest build (inject into StreamingAssets/WebHost)
        uses: actions/download-artifact@v4
        with:
          name: webgl-dist
          path: open_mahjong_unity/Assets/StreamingAssets/WebHost

      - name: Verify WebHost injection
        run: |
          test -f open_mahjong_unity/Assets/StreamingAssets/WebHost/index.html || {
            echo "::error::WebHost/index.html missing"; exit 1; }
          du -sh open_mahjong_unity/Assets/StreamingAssets/WebHost

      - name: Free disk space (Unity builds need room)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: open_mahjong_unity/Library
          key: Library-Android-${{ hashFiles('open_mahjong_unity/Packages/manifest.json') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Prepare Android signing
        env:
          KS_B64_SECRET: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KS_ALIAS_SECRET: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          # 三个 secret 齐全才用 secrets keystore；缺任何一个都回退入库 keystore，
          # 避免 base64 有值但密码为空导致 Unity 报 "please provide passwords"。
          if [ -n "$KS_B64_SECRET" ] && [ -n "$KS_PASS_SECRET" ] && [ -n "$KS_ALIAS_SECRET" ]; then
            printf '%s' "$KS_B64_SECRET" | base64 -d > /tmp/openmahjong.keystore
            echo "KEYSTORE_B64=$KS_B64_SECRET" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASS=$KS_PASS_SECRET" >> "$GITHUB_ENV"
            echo "KEYSTORE_ALIAS=$KS_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "Using keystore from secrets"
          else
            # 回退：使用入库 keystore（私有仓库内部使用，保证所有构建签名一致）
            B64="$(base64 -w0 open_mahjong_unity/ProjectSettings/Keystore/openmahjong.keystore)"
            echo "KEYSTORE_B64=$B64" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASS=openmahjong2025" >> "$GITHUB_ENV"
            echo "KEYSTORE_ALIAS=openmahjong" >> "$GITHUB_ENV"
            echo "Using in-repo keystore (secrets incomplete: b64=${KS_B64_SECRET:+set} pass=${KS_PASS_SECRET:+set} alias=${KS_ALIAS_SECRET:+set})"
          fi

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: open_mahjong_unity
          unityVersion: ${{ github.event.inputs.unityVersion || '6000.4.7f1' }}
          targetPlatform: Android
          androidExportType: androidPackage
          allowDirtyBuild: true
          # 固定签名 keystore，保证各次构建、覆盖安装签名一致
          # （v4 输入名必须用 androidKeystore*/androidKeyalias* 前缀，否则被当作未知输入忽略）
          androidKeystoreName: openmahjong.keystore
          androidKeystoreBase64: ${{ env.KEYSTORE_B64 }}
          androidKeystorePass: ${{ env.KEYSTORE_PASS }}
          androidKeyaliasName: ${{ env.KEYSTORE_ALIAS }}
          androidKeyaliasPass: ${{ env.KEYSTORE_PASS }}
          # 固定产物名，避免改动 productName（应用显示名）时改变 APK 文件名、影响 release 下载链接
          buildName: Android
          versioning: None
          buildsPath: build

      - name: Collect & re-sign APK (v1+v2+v3)
        run: |
          set -euo pipefail
          echo "Found .apk files:"
          find build -type f -iname '*.apk' -print
          APK="$(find build -type f -iname '*.apk' | sort | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::No .apk file found under build/"
            exit 1
          fi
          echo "APK: $APK ($(stat -c%s "$APK") bytes)"
          printf '%s' "$KEYSTORE_B64" | base64 -d > /tmp/release.keystore
          # Unity 的 Android 构建在 unityci 容器内完成，runner 上没有 Android SDK，
          # 临时下载官方 build-tools，用 apksigner 把 APK 重签为 v1+v2+v3。
          # （minSdk>=24 时 AGP 默认只写 v2/v3，部分国产 ROM 安装器据此提示「未签名」）
          BT_ROOT=/tmp/android-build-tools
          if [ ! -x "$BT_ROOT/android-14/apksigner" ]; then
            curl -fsSL https://dl.google.com/android/repository/build-tools_r34-linux.zip -o /tmp/build-tools.zip
            rm -rf "$BT_ROOT" && mkdir -p "$BT_ROOT"
            unzip -q /tmp/build-tools.zip -d "$BT_ROOT"
          fi
          APKSIGNER="$BT_ROOT/android-14/apksigner"
          ZIPALIGN="$BT_ROOT/android-14/zipalign"
          java -version
          "$APKSIGNER" sign \
            --ks /tmp/release.keystore \
            --ks-key-alias "$KEYSTORE_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASS" \
            --key-pass "pass:$KEYSTORE_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$GITHUB_WORKSPACE/Android.apk" "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$GITHUB_WORKSPACE/Android.apk" || true
          # 断言 v1(JAR) 签名存在，否则部分 ROM 安装器仍会提示未签名
          python3 - "$GITHUB_WORKSPACE/Android.apk" <<'PY'
          import re, struct, sys, zipfile
          path = sys.argv[1]
          names = zipfile.ZipFile(path).namelist()
          v1 = [n for n in names if re.fullmatch(r'META-INF/[^/]+\.(RSA|EC|DSA)', n)]
          print("v1 signature entries:", v1 or "MISSING")
          if not v1:
              sys.exit("::error::v1 signature (META-INF/*.RSA) missing; some ROM installers will report unsigned")
          # APK Signing Block 位于中央目录之前，解析其中的 (id, value) 对确认 v2/v3
          data = open(path, 'rb').read()
          eocd = data.rfind(b'PK\x05\x06')
          cd_off = struct.unpack('<I', data[eocd + 16:eocd + 20])[0]
          ids = []
          if data[cd_off - 16:cd_off] == b'APK Sig Block 42':
              size = struct.unpack('<Q', data[cd_off - 24:cd_off - 16])[0]
              p = cd_off - size - 8 + 8
              while p < cd_off - 24:
                  ln = struct.unpack('<Q', data[p:p + 8])[0]
                  ids.append(hex(struct.unpack('<I', data[p + 8:p + 12])[0]))
                  p += 8 + ln
          print("APK Signing Block ids:", ids)
          print("v2 present:", '0x7109871a' in ids, "| v3 present:", '0xf05368c0' in ids)
          if '0x7109871a' not in ids:
              sys.exit("::error::v2 signature missing")
          PY
          # 重签后必须仍然 4K 对齐，否则 Android 6+ 加载未压缩 so 会失败
          "$ZIPALIGN" -c -p 4 "$GITHUB_WORKSPACE/Android.apk"
          echo "zipalign OK"
          sha256sum "$GITHUB_WORKSPACE/Android.apk"
          # APK 文件哈希随 artifact 上传并附到 Release notes：
          # 大文件下载不完整（尾部截断正好切掉 v2/v3 签名块）时部分安装器会
          # 报「未签名」，用户可先核对哈希判断是不是下载损坏。
          APK_SHA256="$(sha256sum "$GITHUB_WORKSPACE/Android.apk" | awk '{print $1}')"
          echo "$APK_SHA256" > "$GITHUB_WORKSPACE/apk-sha256.txt"
          # 输出签名证书指纹：随 artifact 上传并附到 Release notes，覆盖安装前可核对签名一致性
          CERT_SHA256="$(openssl pkcs12 -in /tmp/release.keystore -passin "pass:$KEYSTORE_PASS" -nodes 2>/dev/null \
            | openssl x509 -fingerprint -sha256 -noout | sed 's/.*=//' | tr -d ':')"
          echo "APK signing certificate SHA-256: $CERT_SHA256"
          echo "$CERT_SHA256" > "$GITHUB_WORKSPACE/cert-sha256.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            ${{ github.workspace }}/Android.apk
            ${{ github.workspace }}/apk-sha256.txt
            ${{ github.workspace }}/cert-sha256.txt

  build-windows:
    name: Build Windows
    needs: build-webgl
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download WebGL guest build (inject into StreamingAssets/WebHost)
        uses: actions/download-artifact@v4
        with:
          name: webgl-dist
          path: open_mahjong_unity/Assets/StreamingAssets/WebHost

      - name: Verify WebHost injection
        run: |
          test -f open_mahjong_unity/Assets/StreamingAssets/WebHost/index.html || {
            echo "::error::WebHost/index.html missing"; exit 1; }
          du -sh open_mahjong_unity/Assets/StreamingAssets/WebHost

      - name: Free disk space (Unity builds need room)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Fetch embedded Python runtime
        run: |
          URL="https://www.python.org/ftp/python/3.10.11/python-3.10.11-embed-amd64.zip"
          DEST="open_mahjong_unity/.cache/solo-python/python-3.10.11-embed-amd64"
          mkdir -p "$DEST"
          curl -fsSL "$URL" -o /tmp/python-embed.zip
          unzip -q /tmp/python-embed.zip -d "$DEST"
          test -f "$DEST/python.exe"
          echo "Embedded Python ready at $DEST"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: open_mahjong_unity/Library
          key: Library-Windows-${{ hashFiles('open_mahjong_unity/Packages/manifest.json') }}
          restore-keys: |
            Library-Windows-
            Library-

      - name: Build Windows
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: open_mahjong_unity
          unityVersion: ${{ github.event.inputs.unityVersion || '6000.4.7f1' }}
          targetPlatform: StandaloneWindows64
          allowDirtyBuild: true
          buildName: Windows
          versioning: None
          buildsPath: build

      - name: Package Windows build
        run: |
          find build -maxdepth 3 -type f | head -n 60
          # 只取构建根目录下的启动器 exe（排除 UnityCrashHandler 与 SoloRuntime 内嵌的 python.exe），
          # 其所在目录即完整产物目录（含 *_Data、SoloRuntime、MonoBleedingEdge）
          EXE="$(find build -maxdepth 2 -type f -iname '*.exe' \
                 -not -iname 'UnityCrashHandler*' -not -ipath '*/SoloRuntime/*' | sort | head -n 1)"
          if [ -z "$EXE" ]; then
            echo "::error::No .exe file found under build/"
            exit 1
          fi
          DIR="$(dirname "$EXE")"
          echo "Packaging $DIR"
          (cd "$DIR" && zip -r "$GITHUB_WORKSPACE/Windows.zip" .)

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: ${{ github.workspace }}/Windows.zip

  build-linux:
    name: Build Linux
    needs: build-webgl
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download WebGL guest build (inject into StreamingAssets/WebHost)
        uses: actions/download-artifact@v4
        with:
          name: webgl-dist
          path: open_mahjong_unity/Assets/StreamingAssets/WebHost

      - name: Verify WebHost injection
        run: |
          test -f open_mahjong_unity/Assets/StreamingAssets/WebHost/index.html || {
            echo "::error::WebHost/index.html missing"; exit 1; }
          du -sh open_mahjong_unity/Assets/StreamingAssets/WebHost

      - name: Free disk space (Unity builds need room)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Fetch portable Python runtime
        run: |
          URL="https://github.com/astral-sh/python-build-standalone/releases/download/20240726/cpython-3.10.14%2B20240726-x86_64-unknown-linux-gnu-install_only.tar.gz"
          DEST="open_mahjong_unity/.cache/solo-python/cpython-3.10.14+20240726-x86_64-unknown-linux-gnu-install_only"
          mkdir -p /tmp/pylinux "$DEST"
          curl -fsSL "$URL" -o /tmp/pylinux/python.tar.gz
          tar -xzf /tmp/pylinux/python.tar.gz -C /tmp/pylinux
          cp -a /tmp/pylinux/python/. "$DEST/"
          chmod +x "$DEST/bin/"*
          test -x "$DEST/bin/python3"
          "$DEST/bin/python3" -c "import sys; print('portable python', sys.version)"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: open_mahjong_unity/Library
          key: Library-Linux-${{ hashFiles('open_mahjong_unity/Packages/manifest.json') }}
          restore-keys: |
            Library-Linux-
            Library-

      - name: Build Linux
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: open_mahjong_unity
          unityVersion: ${{ github.event.inputs.unityVersion || '6000.4.7f1' }}
          targetPlatform: StandaloneLinux64
          allowDirtyBuild: true
          buildName: Linux
          versioning: None
          buildsPath: build

      - name: Package Linux build
        run: |
          find build -maxdepth 3 -type f | head -n 60
          # Unity Linux 产物根目录下的启动器名即 buildName（Linux，无扩展名），其所在目录即完整产物目录
          EXE="$(find build -maxdepth 2 -type f -name 'Linux' | sort | head -n 1)"
          if [ -z "$EXE" ]; then
            echo "::error::No Linux launcher found under build/"
            exit 1
          fi
          DIR="$(dirname "$EXE")"
          echo "Packaging $DIR"
          # Unity 容器以 uid 1000 写入产物，runner 用户可能无权 chmod；产物本身已带执行位
          chmod +x "$EXE" 2>/dev/null || true
          if [ -d "$DIR/SoloRuntime/python/bin" ]; then
            chmod +x "$DIR/SoloRuntime/python/bin/"* 2>/dev/null || true
          fi
          test -x "$EXE" || { echo "::error::Linux launcher is not executable"; exit 1; }
          # 不加 -y：符号链接按实体文件存储，避免部分解压工具丢失链接导致 python3 不可用
          (cd "$DIR" && zip -r "$GITHUB_WORKSPACE/Linux.zip" .)

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: ${{ github.workspace }}/Linux.zip

  build-ios:
    name: iOS - Unity -> Xcode -> Unsigned IPA
    needs: build-webgl
    runs-on: macos-15
    # macOS arm64 runner 容量紧张时排队会被自动取消，不能因此阻塞 APK/Windows 发布
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download WebGL guest build (inject into StreamingAssets/WebHost)
        uses: actions/download-artifact@v4
        with:
          name: webgl-dist
          path: open_mahjong_unity/Assets/StreamingAssets/WebHost

      - name: Verify WebHost injection
        run: |
          test -f open_mahjong_unity/Assets/StreamingAssets/WebHost/index.html || {
            echo "::error::WebHost/index.html missing"; exit 1; }
          du -sh open_mahjong_unity/Assets/StreamingAssets/WebHost

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: open_mahjong_unity/Library
          key: Library-iOS-v2-${{ github.ref_name }}-${{ hashFiles('open_mahjong_unity/Packages/manifest.json') }}
          restore-keys: |
            Library-iOS-v2-${{ github.ref_name }}-
            Library-iOS-v2-

      - name: Build iOS (Unity -> Xcode)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: open_mahjong_unity
          unityVersion: ${{ github.event.inputs.unityVersion || '6000.4.7f1' }}
          targetPlatform: iOS
          allowDirtyBuild: true
          versioning: None
          buildsPath: build
          cacheUnityInstallationOnMac: true

      - name: Show project layout & schemes
        run: |
          ls -la build/iOS
          PROJ=$(find build/iOS -maxdepth 3 -name '*.xcodeproj' | head -n 1)
          echo "Project: $PROJ"
          xcodebuild -list -project "$PROJ" || true

      - name: Allow plain HTTP (ATS) in Info.plist
        run: |
          PLIST=$(find build/iOS -maxdepth 3 -name Info.plist | head -n 1)
          echo "Info.plist: $PLIST"
          if [ -n "$PLIST" ] && [ -f "$PLIST" ]; then
            plutil -remove NSAppTransportSecurity "$PLIST" 2>/dev/null || true
            plutil -insert NSAppTransportSecurity -xml '<dict><key>NSAllowsArbitraryLoads</key><true/></dict>' "$PLIST"
            echo "ATS patched:"
            plutil -p "$PLIST" | grep -A2 NSAppTransportSecurity || true
          else
            echo "Info.plist not found, skipping ATS patch"
          fi

      - name: Build unsigned .app
        run: |
          set -euo pipefail
          PROJ=$(find build/iOS -maxdepth 3 -name '*.xcodeproj' | head -n 1)
          echo "Project: $PROJ"
          SCHEME="Unity-iPhone"
          if ! xcodebuild -list -project "$PROJ" | grep -q "Unity-iPhone"; then
            SCHEME=$(xcodebuild -list -project "$PROJ" | awk '/Schemes:/{f=1;next} f&&$1{print $1; exit}')
          fi
          echo "Scheme: $SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 40
          APP=$(find dd/Build/Products -type d -name '*.app' | head -n 1)
          echo "APP: $APP"
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Unsigned.ipa Payload
          ls -lh Unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: Unsigned.ipa
          retention-days: 30

  publish:
    name: Publish Release
    needs: [ build-webgl, build-android, build-windows, build-linux, build-ios ]
    # WebGL + Android + Windows + Linux 成功即发布；iOS IPA 失败（含被取消）时跳过 IPA 继续发
    if: ${{ !cancelled() && needs.build-webgl.result == 'success' && needs.build-android.result == 'success' && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android-apk

      - name: Download WebGL guest build
        uses: actions/download-artifact@v4
        with:
          name: webgl-dist
          path: artifacts/webgl-dist

      - name: Zip WebGL package
        run: |
          # 浏览器版：任意静态服务器可托管；随包内嵌服务（Android/桌面）已自动托管同一份
          (cd artifacts/webgl-dist && zip -qry "$GITHUB_WORKSPACE/artifacts/WebGL.zip" .)
          ls -lh artifacts/WebGL.zip

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: artifacts/windows-package

      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: linux-package
          path: artifacts/linux-package

      - name: Download unsigned IPA
        if: ${{ needs.build-ios.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: unsigned-ipa
          path: artifacts/unsigned-ipa

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.event.inputs.releaseTag || 'latest' }}"
          ls -R artifacts
          # 只上传实际存在的产物（IPA 可能因 macOS runner 容量问题被跳过）
          FILES=$(find artifacts -type f -not -name cert-sha256.txt -not -name apk-sha256.txt | tr '\n' ' ')
          CERT_FPRINT="$(cat artifacts/android-apk/cert-sha256.txt 2>/dev/null || echo 未获取)"
          APK_SHA="$(cat artifacts/android-apk/apk-sha256.txt 2>/dev/null || echo 未获取)"
          APK_SIZE="$(stat -c%s artifacts/android-apk/Android.apk 2>/dev/null || echo 未知)"
          echo "Publishing [$FILES] to release '$TAG'"
          echo "Certificate SHA-256: $CERT_FPRINT"
          echo "APK SHA-256: $APK_SHA"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --title "单机版 + iOS 未签名包 ($TAG)" \
            --notes "自动构建 · run #${{ github.run_number }} · commit ${GITHUB_SHA:0:8} · Unity ${{ github.event.inputs.unityVersion || '6000.4.7f1' }}

          - Android.apk：安卓安装包（v1+v2+v3 签名）
          - Windows.zip：Windows 解压运行
          - Linux.zip：Linux 解压后 chmod +x Linux && ./Linux 运行
          - WebGL.zip：浏览器版客户端。安卓/桌面版已内嵌同一份：房主开房后点「网页邀请」，同一局域网的朋友用浏览器扫码即可加入；单独托管时解压到任意静态服务器亦可
          - Unsigned.ipa：iOS 未签名包，需用 Sideloadly/AltStore + 免费 Apple ID 自签后安装（7天有效期）

          签名证书 SHA-256：${CERT_FPRINT}（固定 keystore；覆盖安装提示签名不一致时核对此指纹）

          Android.apk 大小：${APK_SIZE} 字节 · 文件 SHA-256：${APK_SHA}
          安装提示「未签名/解析失败」时先用哈希核对下载完整性：大文件下载中断会截掉尾部签名块。" \
            $FILES
