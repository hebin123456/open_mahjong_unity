name: Build Android APK (Unity)

on:
  workflow_dispatch:
    inputs:
      unityVersion:
        description: 'Unity version (override only if the GameCI editor image is missing)'
        required: false
        default: '6000.4.7f1'
      releaseTag:
        description: 'Release tag to publish the APK to (default: latest)'
        required: false
        default: 'latest'
  push:
    branches: [ master, feat/offline-hangzhou ]
    paths:
      - 'open_mahjong_unity/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space (Unity builds need room)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: open_mahjong_unity/Library
          key: Library-Android-${{ hashFiles('open_mahjong_unity/Packages/manifest.json') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: open_mahjong_unity
          unityVersion: ${{ github.event.inputs.unityVersion || '6000.4.7f1' }}
          targetPlatform: Android
          androidExportType: androidPackage
          androidAppBundle: false
          allowDirtyBuild: true
          versioning: None
          buildsPath: build

      - name: Locate APK
        id: apk
        run: |
          echo "Found .apk files:"
          find build -type f -iname '*.apk' -print
          APK="$(find build -type f -iname '*.apk' | sort | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::No .apk file found under build/"
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          echo "APK: $APK"

      - name: Publish APK to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.releaseTag || 'latest' }}"
          echo "Publishing ${{ steps.apk.outputs.apk_name }} to release '$TAG'"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --title "Android APK ($TAG)" \
            --notes "自动构建 · run #${{ github.run_number }} · commit ${GITHUB_SHA:0:8} · Unity ${{ github.event.inputs.unityVersion || '6000.4.7f1' }}" \
            "${{ steps.apk.outputs.apk_path }}"
