name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
    inputs:
      unityVersion:
        description: 'Unity version (override only if the GameCI editor image is missing)'
        required: false
        default: '6000.4.7f1'
      releaseTag:
        description: 'Release tag to publish the unsigned IPA to'
        required: false
        default: 'ios-latest'
  push:
    branches: [ feat/offline-hangzhou ]
    paths:
      - 'open_mahjong_unity/**'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: write

jobs:
  export-xcode:
    name: Unity -> Xcode Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space (Unity builds need room)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: open_mahjong_unity/Library
          key: Library-iOS-v2-${{ github.ref_name }}-${{ hashFiles('open_mahjong_unity/Packages/manifest.json') }}
          restore-keys: |
            Library-iOS-v2-${{ github.ref_name }}-
            Library-iOS-v2-

      - name: Build iOS (export Xcode project)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: open_mahjong_unity
          unityVersion: ${{ github.event.inputs.unityVersion || '6000.4.7f1' }}
          targetPlatform: iOS
          allowDirtyBuild: true
          versioning: None
          buildsPath: build

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: build/iOS
          retention-days: 3

  make-ipa:
    name: Xcode -> Unsigned IPA
    needs: export-xcode
    runs-on: macos-15
    steps:
      - name: Download Xcode project
        uses: actions/download-artifact@v4
        with:
          name: xcode-project
          path: xcode

      - name: Show project layout & schemes
        run: |
          ls -la xcode
          xcodebuild -list -project xcode/Unity-iPhone.xcodeproj || true

      - name: Allow plain HTTP (ATS) in Info.plist
        run: |
          PLIST=$(find xcode -maxdepth 3 -name Info.plist | head -n 1)
          echo "Info.plist: $PLIST"
          if [ -n "$PLIST" ] && [ -f "$PLIST" ]; then
            plutil -remove NSAppTransportSecurity "$PLIST" 2>/dev/null || true
            plutil -insert NSAppTransportSecurity -xml '<dict><key>NSAllowsArbitraryLoads</key><true/></dict>' "$PLIST"
            echo "ATS patched:"
            plutil -p "$PLIST" | grep -A2 NSAppTransportSecurity || true
          else
            echo "Info.plist not found, skipping ATS patch"
          fi

      - name: Build unsigned .app
        run: |
          set -euo pipefail
          PROJ=$(find xcode -maxdepth 3 -name '*.xcodeproj' | head -n 1)
          echo "Project: $PROJ"
          SCHEME="Unity-iPhone"
          if ! xcodebuild -list -project "$PROJ" | grep -q "Unity-iPhone"; then
            SCHEME=$(xcodebuild -list -project "$PROJ" | awk '/Schemes:/{f=1;next} f&&$1{print $1; exit}')
          fi
          echo "Scheme: $SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 40
          APP=$(find dd/Build/Products -type d -name '*.app' | head -n 1)
          echo "APP: $APP"
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry unsigned.ipa Payload
          ls -lh unsigned.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: unsigned.ipa
          retention-days: 30

      - name: Publish unsigned IPA to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.releaseTag || 'ios-latest' }}"
          echo "Publishing unsigned.ipa to release '$TAG'"
          gh release delete "$TAG" --yes --cleanup-tag -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Unsigned iOS IPA ($TAG)" \
            --notes "未签名 ipa · run #${{ github.run_number }} · commit ${GITHUB_SHA:0:8} · 用 Sideloadly/AltStore + 免费 Apple ID 自签后安装" \
            unsigned.ipa
